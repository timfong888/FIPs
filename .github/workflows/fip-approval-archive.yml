name: FIP Approval Archive

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  archive-approved-fip:
    runs-on: ubuntu-22.04
    if: contains(github.event.comment.body, 'FIP has been approved')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install filecoin-pin
        run: npm install -g filecoin-pin

      - name: Check filecoin-pin version
        run: |
          VERSION=$(filecoin-pin -V)
          echo "filecoin-pin version: $VERSION"

      - name: Extract FIP metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          REPO="${{ github.repository }}"

          # Get issue details using gh CLI
          ISSUE_DATA=$(gh api repos/$REPO/issues/$ISSUE_NUMBER)

          # Extract metadata
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_AUTHOR=$(echo "$ISSUE_DATA" | jq -r '.user.login')
          ISSUE_CREATED=$(echo "$ISSUE_DATA" | jq -r '.created_at')
          ISSUE_URL=$(echo "$ISSUE_DATA" | jq -r '.html_url')

          # Approval metadata
          APPROVER="${{ github.event.comment.user.login }}"
          APPROVAL_DATE="${{ github.event.comment.created_at }}"
          COMMENT_URL="${{ github.event.comment.html_url }}"

          # Save to environment
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_ENV
          echo "ISSUE_AUTHOR=$ISSUE_AUTHOR" >> $GITHUB_ENV
          echo "ISSUE_CREATED=$ISSUE_CREATED" >> $GITHUB_ENV
          echo "ISSUE_URL=$ISSUE_URL" >> $GITHUB_ENV
          echo "APPROVER=$APPROVER" >> $GITHUB_ENV
          echo "APPROVAL_DATE=$APPROVAL_DATE" >> $GITHUB_ENV
          echo "COMMENT_URL=$COMMENT_URL" >> $GITHUB_ENV

          echo "Metadata extracted for FIP #$ISSUE_NUMBER"

      - name: Create archive directories
        run: |
          mkdir -p fip-archives/fip-${{ env.ISSUE_NUMBER }}
          mkdir -p logs

      - name: Collect FIP data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=${{ env.ISSUE_NUMBER }}
          REPO="${{ github.repository }}"
          ARCHIVE_DIR="fip-archives/fip-${ISSUE_NUMBER}"

          echo "Collecting data for FIP #${ISSUE_NUMBER}..."

          # Get complete issue data
          gh api repos/$REPO/issues/$ISSUE_NUMBER > "$ARCHIVE_DIR/issue.json"

          # Get all comments with pagination
          gh api repos/$REPO/issues/$ISSUE_NUMBER/comments --paginate > "$ARCHIVE_DIR/comments.json"

          # Get issue timeline (events)
          gh api repos/$REPO/issues/$ISSUE_NUMBER/timeline --paginate > "$ARCHIVE_DIR/timeline.json"

          # Get linked files if this is a PR
          if gh api repos/$REPO/issues/$ISSUE_NUMBER | jq -e '.pull_request' > /dev/null; then
            echo "This is a pull request, collecting file changes..."
            gh api repos/$REPO/pulls/$ISSUE_NUMBER/files > "$ARCHIVE_DIR/files.json"
          fi

          echo "Data collection complete"

      - name: Generate README log
        run: |
          ARCHIVE_DIR="fip-archives/fip-${{ env.ISSUE_NUMBER }}"
          README="$ARCHIVE_DIR/README.md"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat > "$README" << EOF
          # FIP Approval Archive

          ## Approval Information

          | Field | Value |
          |-------|-------|
          | **FIP Issue** | [#${{ env.ISSUE_NUMBER }}](${{ env.ISSUE_URL }}) |
          | **Title** | ${{ env.ISSUE_TITLE }} |
          | **Author** | @${{ env.ISSUE_AUTHOR }} |
          | **Created** | ${{ env.ISSUE_CREATED }} |
          | **Approved By** | @${{ env.APPROVER }} |
          | **Approval Date** | ${{ env.APPROVAL_DATE }} |
          | **Approval Comment** | [${{ env.COMMENT_URL }}](${{ env.COMMENT_URL }}) |

          ## Archive Contents

          This archive contains:

          - \`issue.json\` - Complete issue data
          - \`comments.json\` - All comments with full thread
          - \`timeline.json\` - Complete timeline of events
          - \`files.json\` - Changed files (if PR)
          - \`README.md\` - This file

          ## Context

          When a FIP reaches the required approval threshold, a comment stating "FIP has been approved"
          triggers this archival process. All information related to the FIP is collected and permanently
          stored on Filecoin for historical record and cryptographic proof.

          ## Filecoin Storage

          This data is stored on Filecoin using the filecoin-pin service, providing:

          - Permanent decentralized storage
          - Cryptographic proof of data possession (PDP)
          - IPFS content addressing for retrieval
          - Verifiable on-chain storage proofs

          ---

          **Archive Generated**: ${TIMESTAMP}
          **GitHub Action Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          echo "README generated at $README"

      - name: Upload FIP archive to Filecoin
        env:
          PRIVATE_KEY: ${{ secrets.FILECOIN_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.FILECOIN_RPC_URL }}
        run: |
          ARCHIVE_DIR="fip-archives/fip-${{ env.ISSUE_NUMBER }}"

          echo "Uploading FIP #${{ env.ISSUE_NUMBER }} archive to Filecoin..."

          # Upload archive directory to Filecoin
          OUTPUT=$(filecoin-pin add "$ARCHIVE_DIR" 2>&1 | tee upload-output.txt)

          # Extract metadata using same pattern as demo
          ROOT_CID=$(echo "$OUTPUT" | grep 'Root CID:' | awk '{print $3}' || echo "N/A")
          PIECE_CID=$(echo "$OUTPUT" | grep 'Piece CID:' | awk '{print $3}' || echo "N/A")
          SIZE=$(echo "$OUTPUT" | grep 'Size:' | awk '{print $2}' || echo "N/A")
          PIECE_ID=$(echo "$OUTPUT" | grep 'Piece ID:' | awk '{print $3}' || echo "N/A")
          DATASET_ID=$(echo "$OUTPUT" | grep 'Data Set ID:' | awk '{print $4}' || echo "N/A")
          PROVIDER=$(echo "$OUTPUT" | grep 'Name:' | awk '{print $2}' || echo "N/A")
          TX_HASH=$(echo "$OUTPUT" | grep 'Hash:' | awk '{print $2}' || echo "N/A")
          DOWNLOAD_URL=$(echo "$OUTPUT" | grep 'Direct Download URL:' | awk '{print $4}' || echo "N/A")

          # Save to environment
          echo "ROOT_CID=$ROOT_CID" >> $GITHUB_ENV
          echo "PIECE_CID=$PIECE_CID" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV
          echo "PIECE_ID=$PIECE_ID" >> $GITHUB_ENV
          echo "DATASET_ID=$DATASET_ID" >> $GITHUB_ENV
          echo "PROVIDER=$PROVIDER" >> $GITHUB_ENV
          echo "TX_HASH=$TX_HASH" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

          echo "Upload complete!"

      - name: Update README with Filecoin metadata
        run: |
          ARCHIVE_DIR="fip-archives/fip-${{ env.ISSUE_NUMBER }}"
          README="$ARCHIVE_DIR/README.md"

          cat >> "$README" << EOF

          ## Filecoin Upload Details

          | Field | Value |
          |-------|-------|
          | **Root CID** | \`${{ env.ROOT_CID }}\` |
          | **Piece CID** | \`${{ env.PIECE_CID }}\` |
          | **Size** | ${{ env.SIZE }} |
          | **Piece ID** | ${{ env.PIECE_ID }} |
          | **Data Set ID** | ${{ env.DATASET_ID }} |
          | **Storage Provider** | ${{ env.PROVIDER }} |
          | **Transaction Hash** | \`${{ env.TX_HASH }}\` |
          | **Direct Download URL** | ${{ env.DOWNLOAD_URL }} |

          ## IPFS Gateway Links

          - **Browse archive**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}
          - **View README**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}/README.md
          - **View issue data**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}/issue.json
          - **View comments**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}/comments.json

          ## Transaction Details

          View on block explorer: https://calibration.filfox.info/tx/${{ env.TX_HASH }}

          ## Raw Output

          \`\`\`
          EOF

          cat upload-output.txt >> "$README"
          echo '```' >> "$README"

      - name: Create timestamped log
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H%M%S")
          LOG_FILE="logs/fip-${{ env.ISSUE_NUMBER }}-${TIMESTAMP}.md"

          cat > "$LOG_FILE" << EOF
          # FIP #${{ env.ISSUE_NUMBER }} Archive Log

          **Archive Time**: ${TIMESTAMP}
          **Triggered by**: issue_comment event

          ## FIP Information

          | Field | Value |
          |-------|-------|
          | **Issue Number** | [#${{ env.ISSUE_NUMBER }}](${{ env.ISSUE_URL }}) |
          | **Title** | ${{ env.ISSUE_TITLE }} |
          | **Author** | @${{ env.ISSUE_AUTHOR }} |
          | **Approved By** | @${{ env.APPROVER }} |
          | **Approval Date** | ${{ env.APPROVAL_DATE }} |

          ## Upload Metadata

          | Field | Value |
          |-------|-------|
          | **Root CID** | \`${{ env.ROOT_CID }}\` |
          | **Piece CID** | \`${{ env.PIECE_CID }}\` |
          | **Size** | ${{ env.SIZE }} |
          | **Piece ID** | ${{ env.PIECE_ID }} |
          | **Data Set ID** | ${{ env.DATASET_ID }} |
          | **Storage Provider** | ${{ env.PROVIDER }} |
          | **Transaction Hash** | \`${{ env.TX_HASH }}\` |
          | **Direct Download URL** | ${{ env.DOWNLOAD_URL }} |

          ## IPFS Gateway Links

          - **Browse archive**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}
          - **View README**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}/README.md
          - **View issue data**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}/issue.json
          - **View comments**: https://ipfs.io/ipfs/${{ env.ROOT_CID }}/comments.json

          ## Transaction Details

          View on block explorer: https://calibration.filfox.info/tx/${{ env.TX_HASH }}
          EOF

          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV

      - name: Commit archive and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fip-archives/ logs/
          git commit -m "docs: archive FIP #${{ env.ISSUE_NUMBER }} approved by @${{ env.APPROVER }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Comment on issue with archive info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ env.ISSUE_NUMBER }} --body "## 📦 FIP Archived to Filecoin

          This FIP has been permanently archived to Filecoin's decentralized storage network.

          ### Archive Details
          - **Root CID**: \`${{ env.ROOT_CID }}\`
          - **Piece CID**: \`${{ env.PIECE_CID }}\`
          - **Size**: ${{ env.SIZE }}
          - **Transaction**: [\`${{ env.TX_HASH }}\`](https://calibration.filfox.info/tx/${{ env.TX_HASH }})

          ### Access Archived Data
          - 🔗 [Browse archive on IPFS](https://ipfs.io/ipfs/${{ env.ROOT_CID }})
          - 📄 [View README](https://ipfs.io/ipfs/${{ env.ROOT_CID }}/README.md)
          - 📋 [View issue data](https://ipfs.io/ipfs/${{ env.ROOT_CID }}/issue.json)
          - 💬 [View all comments](https://ipfs.io/ipfs/${{ env.ROOT_CID }}/comments.json)

          This archive includes the complete issue thread, all comments, timeline events, and metadata.

          **Approved by**: @${{ env.APPROVER }}
          **Approval date**: ${{ env.APPROVAL_DATE }}"

      - name: Create Summary
        run: |
          echo "# 📦 FIP #${{ env.ISSUE_NUMBER }} Archived to Filecoin" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Access" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Browse Archive on IPFS](https://ipfs.io/ipfs/${{ env.ROOT_CID }})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 **[View README](https://ipfs.io/ipfs/${{ env.ROOT_CID }}/README.md)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Approval Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Approved by**: @${{ env.APPROVER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: ${{ env.APPROVAL_DATE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Comment**: [${{ env.COMMENT_URL }}](${{ env.COMMENT_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Upload Metadata" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Root CID**: \`${{ env.ROOT_CID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Piece CID**: \`${{ env.PIECE_CID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${{ env.SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Piece ID**: ${{ env.PIECE_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Set**: #${{ env.DATASET_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Storage Provider**: ${{ env.PROVIDER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Transaction**: [\`${{ env.TX_HASH }}\`](https://calibration.filfox.info/tx/${{ env.TX_HASH }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download**: ${{ env.DOWNLOAD_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Upload log saved**: \`${{ env.LOG_FILE }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fip-${{ env.ISSUE_NUMBER }}-archive
          path: |
            fip-archives/fip-${{ env.ISSUE_NUMBER }}/
            logs/
            upload-output.txt
